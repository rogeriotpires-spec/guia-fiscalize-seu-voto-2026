name: locais-votacao
on:
  push:
    branches: [censo]
    paths: ['locais/alvo.json']
permissions:
  contents: write
jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: censo, fetch-depth: 1}
      - run: python3 locais/extrai.py
      - name: publica
        run: |
          git config user.name robo-censo && git config user.email robo@users.noreply.github.com
          git checkout -q -B trabalho
          git add -f locais/saida.csv && git commit -qm "locais de votacao"
          for i in 1 2 3 4 5; do git push -q -f origin HEAD:locais-saida && break || sleep 10; done
