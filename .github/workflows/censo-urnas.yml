name: censo-urnas
on:
  push:
    branches: [censo]
    paths: ['disparo/**']
permissions:
  contents: write
concurrency:
  group: censo
  cancel-in-progress: false
jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        parte: ['99']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: censo
          fetch-depth: 1
      - name: retoma a parte, se já houver progresso
        run: |
          git config user.name robo-censo && git config user.email robo@users.noreply.github.com
          if git fetch -q origin censo-parte-${{ matrix.parte }} 2>/dev/null; then
            git checkout -q -B trabalho FETCH_HEAD
          else
            git checkout -q -B trabalho
          fi
      - name: coleta
        env:
          WORKERS: '6'
          LOTE: '2500'
          MINUTOS_MAX: '320'
        run: python3 roda_parte.py ${{ matrix.parte }}
