name: Robô Depoimentos (confere o título e apaga a foto)

on:
  schedule:
    - cron: '22,52 * * * *'
  push:
    branches: [main]
    paths: ['automacao/depo_confere.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robo-depoimentos
  cancel-in-progress: false

jobs:
  conferir:
    if: vars.ROBO_PAUSADO != 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pytesseract==0.3.13 pillow==10.4.0 requests==2.32.3 pillow-heif==0.18.0 pymupdf==1.24.10
      - name: Conferir os títulos
        env:
          PONTE_URL: ${{ vars.PONTE_URL }}
          PONTE_TOKEN: ${{ secrets.PONTE_TOKEN }}
        run: python automacao/depo_confere.py
