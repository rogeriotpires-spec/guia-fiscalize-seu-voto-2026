name: sorteio-ao-vivo
on:
  push:
    branches: [censo]
    paths: ['disparo/sorteio.txt']
permissions:
  contents: write
jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        parte: ['60']
    steps:
      - uses: actions/checkout@v4
        with: {ref: censo, fetch-depth: 1}
      - name: retoma
        run: |
          git config user.name robo-censo && git config user.email robo@users.noreply.github.com
          if git fetch -q origin bu-parte-${{ matrix.parte }} 2>/dev/null; then
            git checkout -q -B trabalho FETCH_HEAD
            git checkout -q origin/censo -- rdv.py bu.py roda_bu.py partes
          else
            git checkout -q -B trabalho
          fi
      - name: coleta
        run: WORKERS=12 python3 roda_bu.py ${{ matrix.parte }}
